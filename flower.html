/* ============================================================
   ATLAS: tiap objek digambar sekali (resolusi asli) ke satu atlas,
   lalu per frame hanya ditempel dengan transformasi.
   ============================================================ */
function build(k){
  const p=D[k],B=p.B,I=p.I,O=p.O,n=O.length,W=p.W,H=p.H;
  const pal=p.P.map(h=>[0,2,4].map(i=>parseInt(h.substr(i,2),16)));
  const bmc=[],bm=b=>bmc[b]||(bmc[b]=Uint8Array.from(B[b][2],c=>parseInt(c,16)));
  const bb=new Int32Array(n*4);
  for(let o=0;o<n;o++){bb[o*4]=bb[o*4+1]=1e9;bb[o*4+2]=bb[o*4+3]=-1e9}
  for(let j=0;j<I.length;j+=5){const o=I[j+4]*4,b=B[I[j+2]];
    bb[o]=Math.min(bb[o],I[j]);bb[o+1]=Math.min(bb[o+1],I[j+1]);
    bb[o+2]=Math.max(bb[o+2],I[j]+b[0]);bb[o+3]=Math.max(bb[o+3],I[j+1]+b[1])}
  const R=new Float32Array(n*8),ord=[...Array(n).keys()];
  for(const o of ord){bb[o*4]=Math.max(0,bb[o*4]);bb[o*4+1]=Math.max(0,bb[o*4+1]);
    bb[o*4+2]=Math.min(W,bb[o*4+2]);bb[o*4+3]=Math.min(H,bb[o*4+3])}
  ord.sort((a,b)=>(bb[b*4+3]-bb[b*4+1])-(bb[a*4+3]-bb[a*4+1]));
  const AW=2048;let x=0,y=0,rh=0;
  for(const o of ord){const w=bb[o*4+2]-bb[o*4],h=bb[o*4+3]-bb[o*4+1];
    if(x+w+2>AW){x=0;y+=rh+2;rh=0}
    R.set([x,y,w,h,bb[o*4],bb[o*4+1],O[o][1],O[o][2]],o*8);x+=w+2;rh=Math.max(rh,h)}
  const AH=y+rh+2,img=new ImageData(AW,AH),d=img.data;
  for(let j=0;j<I.length;j+=5){const o=I[j+4],b=B[I[j+2]],a=bm(I[j+2]),col=pal[I[j+3]];
    const ox=R[o*8]-R[o*8+4],oy=R[o*8+1]-R[o*8+5];
    for(let yy=0;yy<b[1];yy++){const Y=I[j+1]+yy;if(Y<bb[o*4+1]||Y>=bb[o*4+3])continue;
      for(let xx=0;xx<b[0];xx++){const v=a[yy*b[0]+xx];if(!v)continue;const X=I[j]+xx;
        if(X<bb[o*4]||X>=bb[o*4+2])continue;
        const q=((Y+oy)*AW+X+ox)*4,al=v*17;
        if(al>d[q+3]){d[q]=col[0];d[q+1]=col[1];d[q+2]=col[2];d[q+3]=al}}}}
  const AT=mk(AW,AH);AT.getContext('2d').putImageData(img,0,0);
  const ids=Array.from({length:9},()=>[]);O.forEach((o,i)=>ids[o[0]].push(i));
  return{p,k,n,R,AT,ids,O};
}

  const fs={name:'flowerStem',ids:ids[2],par:{lag:.35,rot:.018,per:4.7}};
  init(2,(o,q)=>{Pr[q]=rnd()*PI2});
  fs.update=t=>each(fs,(o,q)=>{const a=O[o][3],h=hOf(O[o][2]),al=clamp((gg(t)-h)/.2),w=wS(t);
    A[q]=sway(h,t-(a?fs.par.lag:0))*w;A[q+1]=0;A[q+2]=a?(a==1?-1:1)*fs.par.rot*w*Math.sin(PI2*t/fs.par.per+Pr[q]):0;
    A[q+3]=.94+.06*al;A[q+4]=al;A[q+5]=0});
  fs.render=()=>draw(fs);L.push(fs);

  /* 5 SMALL FLOWER PETALS & 6 CORES: parameter dibagi per bunga (tag) agar pasangan serasi */
  const fp=(f,s)=>hash(f,s),sd=f=>4.6+fp(f,1)*1.6;
  const sp={name:'smallPetals',ids:ids[7],par:{per:[4,8],rot:.016}};
  const sc={name:'smallCores',ids:ids[8],par:{spk:[5,12]}};
  const base2=(o,t)=>{const f=O[o][3],d=sd(f),al=eo((t-d)/.9),w=sm((t-d-.9)/1.5)*MOT,T=sp.par.per[0]+fp(f,2)*(sp.par.per[1]-sp.par.per[0]),ph=fp(f,3)*PI2;
    return[al,w,T,ph,d]};
  sp.update=t=>each(sp,(o,q)=>{const[al,w,T,ph]=base2(o,t);
    A[q]=1.1*w*Math.sin(PI2*t/T+ph+1);A[q+1]=.5*w*Math.sin(PI2*t/(T*.7)+ph);A[q+2]=sp.par.rot*w*Math.sin(PI2*t/T+ph);
    A[q+3]=.85+.15*al;A[q+4]=al;A[q+5]=0});
  sp.render=()=>draw(sp);
  sc.update=t=>each(sc,(o,q)=>{const[al,w,T,ph]=base2(o,t),Tc=sc.par.spk[0]+fp(O[o][3],4)*(sc.par.spk[1]-sc.par.spk[0]);
    const k=w*Math.pow(Math.max(0,Math.sin(PI2*t/Tc+fp(O[o][3],5)*PI2)),10);
    A[q]=1.1*w*Math.sin(PI2*t/T+ph+1);A[q+1]=.5*w*Math.sin(PI2*t/(T*.7)+ph);A[q+2]=sp.par.rot*w*Math.sin(PI2*t/T+ph);
    A[q+3]=(.85+.15*al)*(1+.07*k);A[q+4]=al;A[q+5]=.55*k*al});
  sc.render=()=>draw(sc);L.push(sp,sc);

  /* 7 MAIN PETALS: bloom bertahap + gentle breathing (fase tiap sektor berbeda) */
  const pt={name:'petals',ids:ids[4],par:{start:3.6,step:.14,dur:1.3,per:[5,8],sc:.008,rot:.004}};
  init(4,(o,q,ob)=>{Pr[q]=pt.par.start+((ob[3]-2+8)%8)*pt.par.step;Pr[q+1]=pt.par.per[0]+rnd()*(pt.par.per[1]-pt.par.per[0]);Pr[q+2]=rnd()*PI2;Pr[q+3]=rnd()*PI2});
  pt.update=t=>each(pt,(o,q)=>{const e=eo((t-Pr[q])/pt.par.dur),w=sm((t-Pr[q]-pt.par.dur)/1.5)*MOT,T=Pr[q+1];
    A[q]=head(t)+.8*w*Math.sin(PI2*t/(T*1.3)+Pr[q+3]);A[q+1]=.7*w*Math.sin(PI2*t/T+Pr[q+2]+1);
    A[q+2]=pt.par.rot*w*Math.sin(PI2*t/(T*1.3)+Pr[q+3]);A[q+3]=(.9+.1*e)*(1+pt.par.sc*w*Math.sin(PI2*t/T+Pr[q+2]));A[q+4]=e;A[q+5]=0});
  pt.render=()=>draw(pt);

  /* 8 MAIN CORE: muncul setelah kelopak + soft pulse (glow lembut) */
  const co={name:'core',ids:ids[5],par:{start:5.2,dur:1.1,per:4.4,glow:.16}};
  co.update=t=>{const e=eo((t-co.par.start)/co.par.dur),w=sm((t-co.par.start-co.par.dur)/1.5)*MOT,pu=.5+.5*Math.sin(PI2*t/co.par.per);
    each(co,(o,q)=>{A[q]=head(t);A[q+1]=A[q+2]=0;A[q+3]=(.92+.08*e)*(1+.008*w*pu);A[q+4]=e;A[q+5]=co.par.glow*w*pu*e});
    gm=eo((t-co.par.start+.2)/1.9)*(1+.09*w*(pu-.5)*2)};                      // cahaya latar pusat bunga
  co.render=()=>draw(co);L.push(pt,co);

  /* 9 FALLING PETALS: melayang turun, lintasan/rotasi/kecepatan berbeda, jejak kilau pada sebagian */
  const fl={name:'falling',ids:ids[6],par:{start:[4.8,6.4],per:[6,12],X:[18,55],Y:[80,150]}};
  init(6,(o,q)=>{Pr[q]=fl.par.start[0]+rnd()*(fl.par.start[1]-fl.par.start[0]);Pr[q+1]=fl.par.per[0]+rnd()*(fl.par.per[1]-fl.par.per[0]);
    Pr[q+2]=(rnd()<.5?-1:1)*(fl.par.X[0]+rnd()*(fl.par.X[1]-fl.par.X[0]));Pr[q+3]=fl.par.Y[0]+rnd()*(fl.par.Y[1]-fl.par.Y[0]);Pr[q+4]=rnd()*PI2;Pr[q+5]=.25+rnd()*.35});
  const FX=[0,0,0,0];                                              // dx,dy,rot,window (buffer dipakai ulang)
  const path=(q,t)=>{const t0=Pr[q],T=Pr[q+1],te=Math.max(t,t0),u=te-t0,ta=MOT?((u/T+.5)%1):.5,tau=ta-.5;
    FX[0]=MOT?Pr[q+2]*tau+6*Math.sin(PI2*u/(T*.6)+Pr[q+4]):0;FX[1]=MOT?Pr[q+3]*tau+3*Math.sin(PI2*u/(T*.45)):0;
    FX[2]=MOT?Pr[q+5]*tau*Math.sign(Pr[q+2])+.12*Math.sin(PI2*u/(T*.5)):0;FX[3]=Math.min(1,ta/.18,(1-ta)/.18)};
  fl.update=t=>each(fl,(o,q)=>{path(q,t);A[q]=FX[0];A[q+1]=FX[1];A[q+2]=FX[2];A[q+3]=1;A[q+4]=eo((t-Pr[q])/1)*FX[3];A[q+5]=0});
  fl.render=()=>{draw(fl);if(!MOT)return;
    each(fl,(o,q)=>{if((o&3)||A[q+4]<.5)return;cx.globalCompositeOperation='lighter';base();cx.fillStyle='#ffc8f0';
      for(let j=1;j<=3;j++){path(q,T_-.14*j);const a=.5*(1-j/4)*A[q+4],x=O[o][1]+FX[0]+4*Math.sin(j*2.1+o),y=O[o][2]+FX[1]+j*3;
        cx.globalAlpha=a;cx.fillRect(x-1.2,y-1.2,2.4,2.4)}});
    cx.globalCompositeOperation='source-over'};
  L.push(fl);
  return L;
}
let T_=0,bf=0;                                                          // waktu animasi sekarang (dipakai jejak kelopak)

/* ---------- efek ambient: dust, bokeh, micro sparkle (rumus tertutup, tanpa alokasi per frame) ---------- */
function ambientInit(){
  const p=Lt.p,fc=p.fc,r=prng(99+p.H),nD=Math.round(p.W*p.H/42000),nB=8,nS=10;
  dust=Float32Array.from({length:nD*7},(_,i)=>{const k=i%7;
    return k==0?clamp(fc[0]+(r()-.5)*fc[2]*2.6,20,p.W-20):k==1?clamp(fc[1]+(r()-.35)*fc[3]*3.2,20,p.H-20):k==2?7+r()*6:k==3?4+r()*5:k==4?r()*12:k==5?(r()-.5)*10:.9+r()*.7});
  dust.n=nD;
  bokeh=Float32Array.from({length:nB*6},(_,i)=>{const k=i%6;return k==0?r()*p.W:k==1?r()*p.H*.8:k==2?14+r()*18:k==3?8+r()*5:k==4?r()*13:.05+r()*.05});
  bokeh.n=nB;
  stars0=Lt.ids[0].map(o=>Lt.O[o]);spark={n:nS};
  if(!orb){orb=mk(64,64);const g=orb.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'rgba(255,170,235,.9)');gr.addColorStop(1,'rgba(255,170,235,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)}
}
function ambient(t){
  if(!MOT)return;const e=sm((t-6)/2);if(e<=0)return;
  base();cx.globalCompositeOperation='lighter';cx.fillStyle='#ffc8f0';
  for(let i=0;i<dust.n;i++){const q=i*7,L=dust[q+2],tau=((t-dust[q+4])/L%1+1)%1,a=Math.sin(Math.PI*tau)*.5*e;if(a<.01)continue;
    const x=dust[q]+dust[q+5]*tau*L*.3+5*Math.sin(t*.4+i),y=dust[q+1]-dust[q+3]*tau*L,s=dust[q+6];cx.globalAlpha=a;cx.fillRect(x-s,y-s,s*2,s*2)}
  for(let i=0;i<bokeh.n;i++){const q=i*6,tau=((t-bokeh[q+4])/(bokeh[q+3])%1+1)%1,a=Math.sin(Math.PI*tau)*bokeh[q+5]*e,rd=bokeh[q+2];
    cx.globalAlpha=a;cx.drawImage(orb,bokeh[q]+8*Math.sin(t*.1+i)-rd,bokeh[q+1]-6*tau*rd-rd,rd*2,rd*2)}
  cx.fillStyle='#fff0fb';
  for(let s=0;s<spark.n;s++){const P=4+hash(s,1)*9,u=(t+hash(s,2)*P)/P,c=Math.floor(u),f=u-c,life=.9/P;if(f>=life)continue;
    const ph=Math.sin(Math.PI*f/life)*.85*e,k=hash(s,c+10),pick=hash(s,c+50);let x,y;
    if(pick<.5&&stars0.length){const o=stars0[Math.floor(k*stars0.length)];x=o[1];y=o[2]}
    else{const fc=Lt.p.fc;x=fc[0]+(hash(s,c+20)-.5)*fc[2]*1.7;y=fc[1]+(hash(s,c+30)-.5)*fc[3]*1.6}
    const a=3+2*ph;cx.globalAlpha=ph;cx.fillRect(x-a,y-.5,a*2,1);cx.fillRect(x-.5,y-a,1,a*2)}
  cx.globalCompositeOperation='source-over'
}

/* ---------- gambar satu frame ---------- */
function render(t){
  T_=t;
  for(const l of LY)l.update(t);                                  // 1) update semua layer
  cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  cx.fillStyle='#000';cx.fillRect(0,0,cv.width,cv.height);
  cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
  const fc=Lt.p.fc;                                               // 2) cahaya pusat bunga (latar)
  cx.setTransform(M[0],0,0,M[0],M[1]+fc[0]*M[0],M[2]+fc[1]*M[0]);cx.scale(fc[2],fc[3]);
  cx.globalCompositeOperation='lighter';cx.globalAlpha=clamp(gm,0,1.2);cx.fillStyle=glowG;cx.fillRect(-2,-2,4,4);
  cx.globalCompositeOperation='source-over';
  for(const l of LY)l.render();                                   // 3) render layer sesuai urutan z
  ambient(t);
  cx.setTransform(1,0,0,1,0,0);                                   // 4) bloom lembut (buffer dipakai ulang)
  if(!(bf++&1)){blx.clearRect(0,0,bl.width,bl.height);blx.drawImage(cv,0,0,bl.width,bl.height)}   // diperbarui tiap 2 frame
  cx.globalCompositeOperation='lighter';cx.globalAlpha=.06;cx.drawImage(bl,0,0,cv.width,cv.height);
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  if(t<1.2){cx.fillStyle='#000';cx.globalAlpha=1-eo(t/1.2);cx.fillRect(0,0,cv.width,cv.height);cx.globalAlpha=1}  // background fade-in
}

/* ---------- ukuran layar & loop utama ---------- */
let T=RM?99:0,last=0,key=null,raf=0;
function resize(){
  const vw=innerWidth,vh=innerHeight,k=vw<vh?'m':'d';
  if(k!==key){key=k;Lt=build(k);A=new Float32Array(Lt.n*6);Pr=new Float32Array(Lt.n*6);LY=layers();ambientInit();
    const g=cx.createRadialGradient(0,0,0,0,0,1.8);for(const s of Lt.p.st)g.addColorStop(Math.min(1,s[0]/1.8+.04),`rgb(${s[1]|0},${s[2]|0},${s[3]|0})`);
    g.addColorStop(1,'rgba(0,0,0,0)');glowG=g}
  const p=Lt.p,S=Math.min(vw/p.W,vh/p.H),dpr=Math.min(devicePixelRatio||1,2,1.25/S);   // glyph sumber 1x: >1.25x tidak menambah detail
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  M=[S*dpr,(vw-p.W*S)/2*dpr,(vh-p.H*S)/2*dpr];
  bl=mk(Math.ceil(cv.width/8),Math.ceil(cv.height/8));blx=bl.getContext('2d');blx.imageSmoothingQuality='high';
  if(RM)render(T)
}
function frame(ms){const dt=Math.min((ms-(last||ms))/1000,.1);last=ms;T+=dt;render(T);raf=requestAnimationFrame(frame)}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,120)});
resize();if(!RM)raf=requestAnimationFrame(frame);
})();
</script>
</body></html>
